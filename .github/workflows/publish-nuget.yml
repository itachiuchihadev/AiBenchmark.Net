name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0.0, v1.0.1
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
    inputs:
      version:
        description: 'Package Version (e.g. 1.0.0). Leave blank to use csproj version'
        required: false
        default: ''

jobs:
  build-and-publish:
    name: Build & Publish AiBenchmark.Net
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NuGet.org Trusted Publishing (OIDC)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Library Dependencies
        run: dotnet restore src/AiBenchmark.Net/AiBenchmark.Net.csproj

      - name: Build Library in Release Mode
        run: dotnet build src/AiBenchmark.Net/AiBenchmark.Net.csproj -c Release --no-restore

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "version_arg=/p:PackageVersion=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=$TAG_VER" >> $GITHUB_ENV
            echo "version_arg=/p:PackageVersion=$TAG_VER" >> $GITHUB_OUTPUT
          else
            echo "version_arg=" >> $GITHUB_OUTPUT
          fi

      - name: Pack AiBenchmark.Net
        run: dotnet pack src/AiBenchmark.Net/AiBenchmark.Net.csproj -c Release --no-build -o ./nupkgs ${{ steps.get_version.outputs.version_arg }}

      - name: NuGet Login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || 'abhishekkumar00019' }}

      - name: Publish Package to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
